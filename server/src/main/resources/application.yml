spring:
  application:
    name: cositi-server
  profiles:
    active: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cositi_db}
    username: ${SPRING_DATASOURCE_USERNAME:cositi_app}
    password: ${SPRING_DATASOURCE_PASSWORD:cositi_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: CositiHikariPool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_batch_fetch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api/v1
  server-header: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# Configuration sécurité JWT & Métier
cositi:
  securite:
    jwt:
      secret: ${JWT_SECRET:c29tZS1zdXBlci1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC1vbmx5LWNoYW5nZS1pbi1wcm9kLTEyMzQ1Njc4}
      expiration-minutes: 15
      refresh-expiration-days: 7
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  stockage:
    repertoire-documents: ${STORAGE_PATH:./uploads/documents}
    taille-max-octets: 10485760 # 10 Mo
