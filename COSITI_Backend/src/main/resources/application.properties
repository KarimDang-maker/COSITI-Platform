# Common Spring Boot properties (shared across profiles)
# Example: logging.level.root=INFO

# ============================================================
# APPLICATION
# ============================================================

spring.application.name=cositi-server
spring.profiles.active=dev
server.port=${SERVER_PORT:8082}


# ============================================================
# DATASOURCE - POSTGRESQL
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cositi_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cositi_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:03012002}
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# HIKARI CONNECTION POOL
# ============================================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=CositiHikariPool


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25


# ============================================================
# FLYWAY
# ============================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration


# ============================================================
# ACTUATOR / MANAGEMENT
# ============================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized


# ============================================================
# COSITI - SECURITE JWT
# ============================================================

cositi.securite.jwt.secret=${JWT_SECRET:c29tZS1zdXBlci1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC1vbmx5LWNoYW5nZS1pbi1wcm9kLTEyMzQ1Njc4}
cositi.securite.jwt.expiration-minutes=15
cositi.securite.jwt.refresh-expiration-days=7


# ============================================================
# COSITI - CORS
# ============================================================

cositi.securite.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}


# ============================================================
# COSITI - STOCKAGE DOCUMENTS
# ============================================================

cositi.stockage.repertoire-documents=${STORAGE_PATH:./uploads/documents}
cositi.stockage.taille-max-octets=10485760