# ============================================================
# PROFIL PRODUCTION — durcissement (jalon J11, docs/04_SECURITE.md §6 et §9)
# ============================================================
#
# Aucune valeur par defaut de developpement ne doit survivre ici : chaque secret vient de
# l'environnement, sans repli. Si une variable manque, l'application doit refuser de demarrer
# plutot que de fonctionner avec un secret connu de tous.


# ------------------------------------------------------------
# Base de donnees — aucun repli, tout vient de l'environnement
# ------------------------------------------------------------

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# ------------------------------------------------------------
# Secrets — obligatoires, sans valeur par defaut
# ------------------------------------------------------------

cositi.securite.jwt.secret=${JWT_SECRET}
cositi.stockage.cle-chiffrement=${STORAGE_ENCRYPTION_KEY}
cositi.securite.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}


# ------------------------------------------------------------
# Messages'erreur — aucune trace technique ne sort de l'API
# ------------------------------------------------------------
# docs/04_SECURITE.md §6 : « server.error.include-stacktrace: never, include-message: never en production ».
# Une pile d'appels dans une reponse HTTP revele l'arborescence des paquetages et les versions de
# bibliotheques ; le message d'erreur metier normalise (ReponseErreur) suffit a l'utilisateur.

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false


# ------------------------------------------------------------
# Banniere serveur — version masquee (docs/04_SECURITE.md §6)
# ------------------------------------------------------------
# Sans cela, chaque reponse annonce « Server: Apache-Coyote/1.1 » et donc le socle technique.

server.server-header=


# ------------------------------------------------------------
# Actuator — surface reduite au strict necessaire (§11)
# ------------------------------------------------------------

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true


# ------------------------------------------------------------
# Journalisation — pas de SQL ni de requetes en clair
# ------------------------------------------------------------

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
spring.jpa.properties.hibernate.format_sql=false


# ------------------------------------------------------------
# Flyway — les migrations sont appliquees, jamais reparees a la volee
# ------------------------------------------------------------

spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
